# Render blueprint. Checked against Render's Blueprint spec (render.com/docs/blueprint-spec)
# in Nov 2026. Deploy it from the dashboard: New → Blueprint → pick this repo.
#
# The three settings that are not negotiable are explained in docs/deploy.md:
# one instance, a persistent disk at /data/logs, and WebSocket-friendly timeouts.

services:
  - type: web
    name: adamant
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # FREE FOR NOW, and free has two costs: it cannot attach a disk, so match logs
    # live on the container filesystem and vanish on every deploy, restart and
    # spin-down; and it sleeps after ~15 min idle (first request wakes it, ~1 min).
    # To keep results: set `plan: 0.5c-512mb` (smallest paid) and uncomment `disk`.
    plan: free
    region: oregon
    healthCheckPath: /api/health

    # The match registry is in-memory and tick loops are asyncio tasks in-process.
    # A second instance would answer 404 for codes it has never seen. Render also
    # refuses to scale a service with a disk attached, so this is doubly pinned.
    numInstances: 1

    # disk:
    #   name: arena-logs
    #   mountPath: /data/logs
    #   sizeGB: 1 # a match log is a few KB; 1 GB holds tens of thousands

    envVars:
      # PORT is injected by Render and read by the container's CMD — do not set it.
      - key: ARENA_LOG_DIR
        value: /data/logs
      - key: ARENA_LOG_LEVEL
        value: info
      # Only needed if the UI is ever served from a different origin than the API.
      # - key: ARENA_CORS_ORIGINS
      #   value: https://arena.example.com
      #
      # Optional, and the only setting that costs money: with a key present, any host
      # of a match on this instance can spend your OpenRouter credit through the
      # lobby's Add LLM agent button (spec §8.6). Set it in the dashboard as a secret,
      # never here. Without it that button is disabled and nothing else changes.
      # - key: OPENROUTER_API_KEY
      #   sync: false
