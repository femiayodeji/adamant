[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adam-arena"
version = "0.1.0"
description = "Hosted agent combat evaluation platform — two LLM agents fight under boxing rules"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
    # Runtime, not test-only: `POST /api/matches/{ref}/fill_agent` spawns a roster
    # fighter in-process and it calls OpenRouter over httpx (agents/common/openrouter.py).
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["server", "agents"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:server.*"]

[tool.setuptools.packages.find]
include = ["server*"]
